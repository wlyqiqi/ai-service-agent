<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>澄元智能客服</title>
<style>

/* ============================================================
   design-taste-frontend 改版 v4（2026-09-18）
   设计读法：premium smart-home consumer chat surface（redesign
   overhaul，保留 IA / 事件协议 / 逻辑层契约）。
   参考 web/DESIGN-mistral.ai.md：日落暖橙（#FA520F）+ 奶油面板 +
   墨色正文；日落条纹带为全站签名；按钮/输入 8px · 卡片 12px ·
   面板 20px，仅徽章保留 pill；用户气泡 = 墨色深底（button-dark 语言）。
   橙只出现在主 CTA / 激活态 / 签名条纹，不进气泡、不铺大面。
   Dials: VARIANCE 5 / MOTION 4 / DENSITY 3
   Shape lock（唯一半径规则）：面板 20px · 卡片/气泡 12px ·
   按钮/输入 8px · 图标按钮圆形 · 徽章 pill
   ============================================================ */
:root{
  --bg:#fafafa;
  --topbar-bg:rgba(255,255,255,.78);
  --surface:#ffffff;
  --surface-2:#fafafa;
  --surface-3:#f5f5f5;
  --cream:#fff8e0;
  --cream-soft:#fffaeb;
  --beige-deep:#e6d5a8;
  --bubble-ai:#ffffff;
  --bubble-user:#1f1f1f;
  --bubble-user-text:#ffffff;
  --ink:#1f1f1f;
  --ink-2:#4a4a4a;
  --ink-3:#8a8a8a;
  --line:#ededed;
  --line-strong:#c7c7c7;
  --accent:#fa520f;
  --accent-strong:#cc3a05;
  --accent-weak:rgba(250,82,15,.08);
  --accent-text:#cc3a05;
  --accent-line:rgba(250,82,15,.24);
  --btn-text:#ffffff;
  --stripe:linear-gradient(90deg,#ff8105,#ffb83e,#ffd900,#fff8e0);
  --glow-1:rgba(255,177,16,.12);
  --glow-2:rgba(250,82,15,.07);
  --ok:#0ea572;
  --warn:#c47f0e;
  --warn-weak:#fdf3e3;
  --warn-line:rgba(196,127,14,.22);
  --danger:#d93b3b;
  --danger-weak:#fdecec;
  --danger-line:rgba(217,59,59,.22);
  --shadow-panel:0 1px 2px rgba(31,31,31,.05),0 20px 48px -32px rgba(31,31,31,.18);
  --shadow-card:0 1px 2px rgba(31,31,31,.04);
  --shadow-btn:0 6px 16px -10px rgba(250,82,15,.55);
  --r-xl:20px;
  --r-lg:12px;
  --r-md:8px;
  --r-pill:999px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
html[data-theme="dark"]{
  --bg:#141210;
  --topbar-bg:rgba(20,18,16,.78);
  --surface:#1c1917;
  --surface-2:#211d1a;
  --surface-3:#2a241d;
  --cream:#2b241c;
  --cream-soft:#241f19;
  --beige-deep:#4a4034;
  --bubble-ai:#211d1a;
  --bubble-user:#f2ede6;
  --bubble-user-text:#1f1f1f;
  --ink:#f2ede6;
  --ink-2:#b8b0a6;
  --ink-3:#8a8178;
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(255,255,255,.15);
  --accent:#ff6b2b;
  --accent-strong:#ff8547;
  --accent-weak:rgba(255,107,43,.14);
  --accent-text:#ffb289;
  --accent-line:rgba(255,178,137,.26);
  --btn-text:#0a0f1e;
  --glow-1:rgba(255,129,5,.14);
  --glow-2:rgba(255,184,62,.07);
  --ok:#3bd68c;
  --warn:#f0b34a;
  --warn-weak:rgba(245,158,11,.14);
  --warn-line:rgba(240,179,74,.26);
  --danger:#f3706f;
  --danger-weak:rgba(239,68,68,.14);
  --danger-line:rgba(243,112,111,.26);
  --shadow-panel:0 1px 0 rgba(255,255,255,.03),0 1px 2px rgba(0,0,0,.4),
    0 30px 64px -34px rgba(0,0,0,.62);
  --shadow-card:0 1px 2px rgba(0,0,0,.35);
  --shadow-btn:0 8px 20px -10px rgba(109,149,255,.4);
}
*{box-sizing:border-box}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,
  "Segoe UI Variable Display","Segoe UI","PingFang SC","Hiragino Sans GB",
  "Microsoft YaHei UI","Microsoft YaHei","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.6}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(52rem 34rem at 6% -12%,var(--glow-1),transparent 62%),
    radial-gradient(46rem 30rem at 104% 4%,var(--glow-2),transparent 60%),
    radial-gradient(64rem 42rem at 50% 118%,var(--glow-2),transparent 64%)}
body::after{content:"";position:fixed;top:0;left:0;right:0;height:6px;z-index:40;
  background:var(--stripe);pointer-events:none}
button{font-family:inherit}
button,input{-webkit-tap-highlight-color:transparent}
::selection{background:var(--accent-weak);color:var(--accent-text)}

.topbar{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;
  gap:14px;padding:0 26px;background:var(--topbar-bg);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{flex:none;width:32px;height:32px;border-radius:var(--r-md);background:var(--accent);
  color:var(--btn-text);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 5px 14px -8px var(--accent)}
.brand-logo.lg{width:56px;height:56px;border-radius:var(--r-lg);font-size:26px;margin:0 auto 20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 16px 34px -16px var(--accent)}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.01em}
.brand-sub{font-size:10px;color:var(--ink-3);letter-spacing:.14em;
  font-family:Georgia,"Times New Roman",serif}
.icon-btn{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;
  justify-content:center;cursor:pointer;
  transition:border-color .2s var(--ease),color .2s var(--ease),background .2s var(--ease),transform .15s var(--ease)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-text);background:var(--accent-weak)}
.icon-btn:active{transform:scale(.94)}
.ico-sun{display:none}
html[data-theme="dark"] .ico-sun{display:block}
html[data-theme="dark"] .ico-moon{display:none}
.topbar-user{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-weak);
  color:var(--accent-text);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700}
.user-name{font-size:13px;color:var(--ink-2)}

.view{display:none}
.view.active{display:block;animation:view-in .32s var(--ease) both}
@keyframes view-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.chat-wrap{position:relative;max-width:880px;margin:16px auto 22px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-panel);
  display:flex;flex-direction:column;height:calc(100dvh - 98px);min-height:520px;overflow:hidden}
.chat-wrap::before{content:"";position:absolute;top:0;left:22px;right:22px;height:1px;z-index:1;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);pointer-events:none}
html[data-theme="dark"] .chat-wrap::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
.chat-head{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--line)}
.agent-avatar{flex:none;width:42px;height:42px;border-radius:var(--r-lg);background:var(--accent);
  color:var(--btn-text);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 20px -12px var(--accent)}
.chat-meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.chat-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chat-title{font-size:15px;font-weight:700;letter-spacing:-.01em}
.conn-text{font-size:12px;color:var(--ink-3)}
.status-tag{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;
  border-radius:var(--r-pill);font-size:12px;font-weight:600;letter-spacing:.02em;
  border:1px solid transparent}
.status-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status-tag.ai{background:var(--accent-weak);color:var(--accent-text);border-color:var(--accent-line)}
.status-tag.ai::before{background:var(--accent);animation:dot-pulse 2.6s ease-in-out infinite}
.status-tag.human{background:var(--warn-weak);color:var(--warn);border-color:var(--warn-line)}
@keyframes dot-pulse{0%,100%{box-shadow:0 0 0 0 rgba(250,82,15,.4)}55%{box-shadow:0 0 0 5px rgba(250,82,15,0)}}

.chips{display:flex;gap:8px;flex-wrap:wrap;padding:13px 24px;border-bottom:1px solid var(--line)}
.chip{appearance:none;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-2);border-radius:var(--r-md);height:32px;padding:0 15px;font-size:13px;
  font-weight:500;cursor:pointer;display:inline-flex;align-items:center;
  transition:border-color .2s var(--ease),color .2s var(--ease),
  background .2s var(--ease),transform .15s var(--ease),box-shadow .2s var(--ease)}
.chip:hover{border-color:var(--accent);color:var(--accent-text);background:var(--accent-weak);
  box-shadow:0 4px 12px -8px var(--accent)}
.chip:active{transform:scale(.96)}

.msg-list{flex:1;overflow-y:auto;padding:26px 26px 22px;display:flex;flex-direction:column;gap:18px;
  scroll-behavior:smooth}
.msg-list:empty{align-items:center;justify-content:center}
.msg-list:empty::before{content:"澄";width:48px;height:48px;border-radius:var(--r-lg);
  display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;
  color:#ffffff;background:var(--accent);border:1px solid var(--accent-strong);
  box-shadow:0 12px 28px -16px var(--accent);
  margin-bottom:16px}
html[data-theme="dark"] .msg-list:empty::before{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 28px -16px var(--accent)}
.msg-list:empty::after{content:"您好，我是澄元智能客服，有问题随时问我。\A 查订单、食谱咨询、固件更新，或直接选择上方快捷指令。";
  white-space:pre-line;text-align:center;color:var(--ink-3);font-size:14px;line-height:2;
  display:block;max-width:420px}
.msg-list .enter{animation:msg-in .4s var(--ease) both}
@keyframes msg-in{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}

.msg{max-width:74%;padding:11px 16px;border-radius:var(--r-lg);font-size:14px;line-height:1.66;
  white-space:pre-wrap;overflow-wrap:break-word;position:relative}
.msg.user{align-self:flex-end;background:var(--bubble-user);color:var(--bubble-user-text);
  border-radius:var(--r-lg);box-shadow:var(--shadow-card)}
.msg.assistant{align-self:flex-start;background:var(--bubble-ai);border:1px solid var(--line);
  color:var(--ink);border-radius:var(--r-lg);margin-left:44px;
  box-shadow:var(--shadow-card)}
html[data-theme="dark"] .msg.assistant{box-shadow:inset 0 1px 0 rgba(255,255,255,.04),var(--shadow-card)}
html[data-theme="dark"] .msg.assistant::before,html[data-theme="dark"] .card::before{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.msg.system{align-self:center;background:var(--surface-2);border:1px solid var(--line);
  color:var(--ink-2);font-size:12px;border-radius:var(--r-pill);padding:5px 14px;max-width:90%}
.msg.assistant.typing::after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;
  vertical-align:-.15em;border-radius:1px;background:var(--accent);animation:caret-blink 1.05s steps(2,start) infinite}
@keyframes caret-blink{0%,100%{opacity:1}50%{opacity:0}}
.msg.assistant::before,.card::before{content:"澄";position:absolute;left:-44px;top:2px;width:32px;height:32px;
  border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  color:var(--accent-text);background:var(--cream-soft);border:1px solid var(--beige-deep)}

.card{position:relative;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-lg);padding:16px 18px;font-size:13px;max-width:74%;
  align-self:flex-start;margin-left:44px;box-shadow:var(--shadow-card);overflow-wrap:break-word}
.card h4{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--accent-text)}
.card p{margin:4px 0;color:var(--ink-2);line-height:1.6}
.tool-card h4{color:var(--ink-2)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.notice,.error-bar,.handoff-banner{max-width:86%;align-self:stretch;border-radius:var(--r-md);
  padding:11px 14px;font-size:13px;line-height:1.6;overflow-wrap:break-word;
  border:1px solid var(--line);border-left-width:3px}
.notice{background:var(--warn-weak);border-left-color:var(--warn);color:var(--warn)}
.error-bar{background:var(--danger-weak);border-left-color:var(--danger);color:var(--danger)}
.handoff-banner{background:var(--accent-weak);border-left-color:var(--accent);color:var(--accent-text)}

.btn{appearance:none;border:none;border-radius:var(--r-md);padding:9px 18px;font-size:13px;
  font-weight:600;cursor:pointer;letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;
  transition:transform .15s var(--ease),background .2s var(--ease),
  border-color .2s var(--ease),box-shadow .2s var(--ease),filter .2s var(--ease)}
.btn.primary{background:var(--accent);color:var(--btn-text);
  background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 55%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),var(--shadow-btn)}
html[data-theme="dark"] .btn.primary{background-image:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 55%)}
.btn.primary:hover:not(:disabled){background:var(--accent-strong);filter:none}
.btn.primary:active:not(:disabled){transform:translateY(1px) scale(.99)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent-text)}
.btn.ghost:active:not(:disabled){transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%;padding:12px 18px;font-size:14px}
.btn.chip{height:30px;padding:0 14px}

.input-bar{padding:14px 22px 18px;border-top:1px solid var(--line);
  background:linear-gradient(180deg,transparent,rgba(250,82,15,.02))}
html[data-theme="dark"] .input-bar{background:linear-gradient(180deg,transparent,rgba(255,255,255,.02))}
.composer{display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--line-strong);border-radius:var(--r-md);padding:6px 6px 6px 16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease),background .18s var(--ease)}
html[data-theme="dark"] .composer{box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.composer:focus-within{border-color:var(--accent);background:var(--surface);
  box-shadow:0 0 0 3px var(--accent-weak),inset 0 1px 0 rgba(255,255,255,.55)}
html[data-theme="dark"] .composer:focus-within{box-shadow:0 0 0 3px var(--accent-weak),inset 0 1px 0 rgba(255,255,255,.04)}
.composer input{flex:1;min-width:0;border:none;background:transparent;color:var(--ink);
  font-size:14px;outline:none;padding:9px 0;caret-color:var(--accent)}
.composer input::placeholder{color:var(--ink-3)}
.composer input:disabled{opacity:.6;cursor:not-allowed}
.send-btn{flex:none;width:38px;height:38px;border:none;border-radius:var(--r-md);background:var(--accent);
  border-radius:var(--r-md);
  color:var(--btn-text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 12px -6px var(--accent);
  transition:transform .15s var(--ease),box-shadow .25s var(--ease),filter .25s var(--ease),opacity .2s var(--ease)}
.send-btn:hover:not(:disabled){filter:brightness(1.05);transform:translateY(-1px)}
.send-btn:active:not(:disabled){transform:translateY(0) scale(.94)}
.send-btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}

.login-wrap{position:relative;max-width:392px;margin:9vh auto 0;background:var(--cream-soft);
  border:1px solid var(--beige-deep);border-radius:var(--r-xl);padding:46px 40px 34px;box-shadow:var(--shadow-panel);
  overflow:hidden}
.login-wrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
  background:var(--stripe);pointer-events:none}
.login-wrap::before{content:"";position:absolute;top:0;left:22px;right:22px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent)}
html[data-theme="dark"] .login-wrap::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.login-wrap>*{animation:view-in .55s var(--ease) both}
.login-wrap>*:nth-child(2){animation-delay:.04s}
.login-wrap>*:nth-child(3){animation-delay:.08s}
.login-wrap>*:nth-child(4){animation-delay:.12s}
.login-wrap>*:nth-child(5){animation-delay:.16s}
.login-wrap>*:nth-child(6){animation-delay:.2s}
.login-wrap>*:nth-child(7){animation-delay:.24s}
.login-wrap h2{margin:0 0 6px;font-size:21px;font-weight:700;letter-spacing:-.01em;text-align:center}
.login-sub{margin:0 0 28px;font-size:13px;color:var(--ink-3);text-align:center}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.field input{width:100%;border:1px solid var(--line-strong);background:var(--surface-2);
  color:var(--ink);border-radius:var(--r-md);padding:12px 14px;font-size:14px;outline:none;caret-color:var(--accent);
  transition:border-color .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease)}
.field input::placeholder{color:var(--ink-3)}
.field input:hover{border-color:var(--line-strong)}
.field input:focus{border-color:var(--accent);background:var(--surface);
  box-shadow:0 0 0 3px var(--accent-weak)}
.hint{font-size:12px;color:var(--ink-3);text-align:center;margin:14px 0 0;line-height:1.6}
.hint.error{color:var(--danger)}

.btn:focus-visible,.icon-btn:focus-visible,.chip:focus-visible,.send-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg-list::-webkit-scrollbar{width:8px}
.msg-list::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;
  border:2px solid transparent;background-clip:content-box}
.msg-list::-webkit-scrollbar-thumb:hover{background:var(--ink-3);border:2px solid transparent;background-clip:content-box}
.msg-list::-webkit-scrollbar-track{background:transparent}

@media (max-width:900px){
  .topbar{padding:0 16px}
  .chat-wrap{margin:8px;height:calc(100dvh - 76px);min-height:460px}
  .msg{max-width:86%}
  .card{max-width:86%}
  .msg-list{padding:20px 16px}
  .chips,.chat-head,.input-bar{padding-left:16px;padding-right:16px}
}
@media (max-width:560px){
  .msg.assistant,.card{margin-left:0}
  .msg.assistant::before,.card::before{display:none}
  .msg.assistant,.card{border-radius:var(--r-lg)}
  .login-wrap{margin:6vh auto 0;padding:38px 24px 30px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-logo" aria-hidden="true">澄</span>
    <span class="brand-text">
      <span class="brand-name">澄元</span>
      <span class="brand-sub">CHENGYUAN SMART HOME</span>
    </span>
  </div>
  <button class="icon-btn" id="btn-theme" type="button" aria-label="切换深色模式" title="切换深浅主题">
    <svg class="ico-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>

        </button>

<script>
(function () {
  'use strict';

  /* ============ 纯逻辑层（DOM 无关，Node vm 可测） ============ */

  function createInitialStore() {
    return {
      view: null,
      auth: null,
      conversation: { conversation_id: null, mode: 'ai' },
      messages: [],
      conn: { status: 'idle', lastError: null },
      pendingAction: null,
      config: { mock: false, baseUrl: '' },
    };
  }

  function resolveView(hash, hasToken) {
    if (!hasToken) return 'login';
    return hash === '#/login' ? 'login' : 'chat';
  }

  var EVENT_TYPES = [
    'token', 'tool_call', 'tool_result', 'clarification_required',
    'confirmation_required', 'confirmation_updated', 'approval_required',
    'approval_updated', 'safety_rejected', 'handoff_created',
    'handoff_resolved', 'error', 'done',
  ];

  function msgId() {
    return 'm-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function resetConversation(store) {
    var s = JSON.parse(JSON.stringify(store));
    s.conversation = { conversation_id: null, mode: 'ai' };
    s.messages = [];
    s.conn = { status: 'idle', lastError: null };
    s.pendingAction = null;
    return s;
  }

  function mergeHistory(existing, incoming) {
    var seen = {};
    var out = [];
    existing.forEach(function (m) { if (m.id) seen[m.id] = true; out.push(m); });
    (incoming || []).forEach(function (m) {
      var id = m.id || msgId();
      if (seen[id]) return;
      seen[id] = true;
      out.push({
        id: id,
        role: m.role === 'user' ? 'user' : 'assistant',
        kind: 'text',
        content: m.text || m.content || '',
        meta: m.meta || {},
      });
    });
    return out;
  }

  function applyEvent(store, event) {
    var type = event.type;
    var data = event.data || {};
    var s = JSON.parse(JSON.stringify(store));
    s.conn.lastError = null;

    switch (type) {
      case 'token':
        s.conn.status = 'streaming';
        var last = s.messages[s.messages.length - 1];
        if (last && last.role === 'assistant' && last.kind === 'text') {
          last.content += data.text || '';
        } else {
          s.messages.push({ id: msgId(), role: 'assistant', kind: 'text', content: data.text || '', meta: {} });
        }
        break;
      case 'tool_call':
        s.conn.status = 'streaming';
        s.messages.push({ id: msgId(), role: 'assistant', kind: 'tool',
          content: { name: data.name, args: data.args || {} }, meta: { phase: 'call' } });
        break;
      case 'tool_result':
        for (var i = s.messages.length - 1; i >= 0; i--) {
          if (s.messages[i].kind === 'tool' && s.messages[i].meta.phase === 'call') {
            s.messages[i].meta = { phase: 'result', ok: !!data.ok, summary: data.summary || '' };
            break;
          }
        }
        break;
      case 'clarification_required':
        s.messages.push({ id: msgId(), role: 'assistant', kind: 'clarify',
          content: { missing: data.missing || [], reason: data.reason || null }, meta: {} });
        break;
      case 'confirmation_required':
        s.pendingAction = { kind: 'confirm', status: 'pending', summary: data.summary || '' };
        s.messages.push({ id: msgId(), role: 'assistant', kind: 'confirm',
          content: { summary: data.summary || '' }, meta: { status: 'pending' } });
        break;
      case 'confirmation_updated':
        var confirmStatus = data.action === 'confirmed' ? 'confirmed' : 'canceled';
        if (s.pendingAction && s.pendingAction.kind === 'confirm') s.pendingAction.status = confirmStatus;
        for (var j = s.messages.length - 1; j >= 0; j--) {
          if (s.messages[j].kind === 'confirm') { s.messages[j].meta.status = confirmStatus; break; }
        }
        break;
      case 'approval_required':
        s.pendingAction = { kind: 'approval', id: data.approval_id, status: 'pending',
          summary: data.summary || '', expires_at: data.expires_at || null };
        s.messages.push({ id: msgId(), role: 'assistant', kind: 'approval',
          content: { approval_id: data.approval_id, summary: data.summary || '', expires_at: data.expires_at || null },
          meta: { status: 'pending' } });
        break;
      case 'approval_updated':
        var approvalStatus = data.status || 'pending';
        if (s.pendingAction && s.pendingAction.kind === 'approval' && s.pendingAction.id === data.approval_id) {
          s.pendingAction.status = approvalStatus;
        }
        for (var k = s.messages.length - 1; k >= 0; k--) {
          if (s.messages[k].kind === 'approval') { s.messages[k].meta.status = approvalStatus; break; }
        }
        break;
      case 'safety_rejected':
        s.messages.push({ id: msgId(), role: 'assistant', kind: 'notice',
          content: { rule: data.rule || '', reason: data.reason || '' }, meta: {} });
        break;
      case 'handoff_created':
        s.conversation.mode = 'human';
        s.conn.status = 'polling';
        s.messages.push({ id: msgId(), role: 'system', kind: 'handoff',
          content: { reason: data.reason || '', summary: data.summary || '' }, meta: { state: 'created' } });
        break;
      case 'handoff_resolved':
        s.conversation.mode = 'ai';
        s.conn.status = 'idle';
        s.messages.push({ id: msgId(), role: 'system', kind: 'handoff', content: {}, meta: { state: 'resolved' } });
        break;
      case 'error':
        s.conn.lastError = { code: data.code || 'E_UNKNOWN', message: data.message || '未知错误' };
        s.messages.push({ id: msgId(), role: 'system', kind: 'error',
          content: { code: data.code || 'E_UNKNOWN', message: data.message || '未知错误' }, meta: {} });
        break;
      case 'done':
        // event-spec done.final 契约：无 token 流（如 KB 缺口整段回复）时，
        // 最终文本只携带在 done.final 里；有 token 流时其内容已拼入末条 text，幂等跳过。
        s.conn.status = s.conversation.mode === 'human' ? 'polling' : 'idle';
        if (typeof data.final === 'string' && data.final) {
          var last = s.messages[s.messages.length - 1];
          var alreadyShown = last && last.kind === 'text' && last.role === 'assistant' &&
            last.content === data.final;
          if (!alreadyShown) {
            s.messages.push({ id: msgId(), role: 'assistant', kind: 'text',
              content: data.final, meta: {} });
          }
        }
        break;
    }
    return s;
  }
  var QUICK_CMDS = [
    { label: '新会话', cmd: '重新开始' },
    { label: '查订单', cmd: '查询我的订单' },
    { label: '食谱咨询', cmd: '我想咨询食谱' },
    { label: '固件更新', cmd: '如何更新固件' },
    { label: 'App 配对', cmd: '如何配对 Chengyuan Home App' },
    { label: '申请售后', cmd: '我要申请售后' },
    { label: '转人工', cmd: '转人工客服' },
  ];

  function statusLabel(status) {
    if (status === 'approved') return '已通过';
    if (status === 'rejected') return '已拒绝';
    if (status === 'expired') return '已过期';
    return '审批中';
  }

  function messageNode(m) {
    switch (m.kind) {
      case 'text':
        return { tag: 'div', attrs: { class: 'msg ' + m.role }, children: [m.content] };
      case 'tool':
        return { tag: 'div', attrs: { class: 'card tool-card' }, children: [
          { tag: 'h4', children: ['工具 · ' + m.content.name] },
          { tag: 'p', children: [m.meta.phase === 'result'
            ? (m.meta.ok ? '✓ ' + m.meta.summary : '✗ ' + m.meta.summary)
            : '执行中…'] },
        ] };
      case 'clarify':
        var missing = m.content.missing || [];
        var kids = [
          { tag: 'h4', children: ['需要补充信息'] },
          { tag: 'p', children: ['请提供：' + missing.join('、')] },
        ];
        if (missing.length) {
          kids.push({
            tag: 'div', attrs: { class: 'row' }, children: missing.map(function (field) {
              return { tag: 'button', attrs: { class: 'btn ghost chip', 'data-action': 'clarify', 'data-field': field }, children: ['补充 ' + field] };
            }),
          });
        }
        return { tag: 'div', attrs: { class: 'card' }, children: kids };
      case 'confirm':
        return { tag: 'div', attrs: { class: 'card' }, children: [
          { tag: 'h4', children: ['请确认操作'] },
          { tag: 'p', children: [m.content.summary] },
          m.meta.status === 'pending'
            ? { tag: 'div', attrs: { class: 'row' }, children: [
                { tag: 'button', attrs: { class: 'btn primary', 'data-action': 'confirm', 'data-msg-id': m.id }, children: ['确认'] },
                { tag: 'button', attrs: { class: 'btn ghost', 'data-action': 'cancel', 'data-msg-id': m.id }, children: ['取消'] },
              ] }
            : { tag: 'p', children: [m.meta.status === 'confirmed' ? '已确认' : '已取消'] },
        ] };
      case 'approval':
        return { tag: 'div', attrs: { class: 'card' }, children: [
          { tag: 'h4', children: ['高风险操作 · 人工审批中'] },
          { tag: 'p', children: [m.content.summary] },
          { tag: 'p', children: ['状态：' + statusLabel(m.meta.status) +
            (m.content.expires_at ? '（' + m.content.expires_at + ' 到期）' : '')] },
        ] };
      case 'notice':
        return { tag: 'div', attrs: { class: 'notice' }, children: ['安全拦截：' + m.content.reason] };
      case 'handoff':
        return m.meta.state === 'created'
          ? { tag: 'div', attrs: { class: 'handoff-banner' }, children: ['已转人工客服' + (m.content.summary ? '：' + m.content.summary : '')] }
          : { tag: 'div', attrs: { class: 'handoff-banner' }, children: ['人工服务已结束，AI 客服继续为您服务'] };
      case 'error':
        return { tag: 'div', attrs: { class: 'error-bar' }, children: ['[' + m.content.code + '] ' + m.content.message] };
    }
  }

  function buildView(store) {
    var human = store.conversation.mode === 'human';
    var reconnecting = store.conn.status === 'reconnecting';
    return {
      headerStatus: human
        ? { text: '人工接待中', cls: 'human', connText: '当前由人工客服接待' }
        : { text: 'AI 在线', cls: 'ai', connText: reconnecting ? '连接中断，重连中…' : '连接正常' },
      chips: QUICK_CMDS.map(function (c) {
        return { tag: 'button', attrs: { class: 'chip', 'data-cmd': c.cmd }, children: [c.label] };
      }),
      messages: store.messages.map(messageNode),
      inputDisabled: store.conn.status === 'streaming' || store.conn.status === 'reconnecting',
    };
  }
  function createApi(config) {
    var base = (config && config.baseUrl) || '';
    var token = (config && config.token) || null;
    var fetchImpl = (config && config.fetchImpl) || (typeof fetch !== 'undefined' ? fetch : null);

    function headers() {
      var h = { 'Content-Type': 'application/json' };
      if (token) h['Authorization'] = 'Bearer ' + token;
      return h;
    }

    function apiError(label, r) {
      var err = new Error(label + ' ' + r.status);
      err.status = r.status;
      err.code = r.status === 401 ? 'AUTH_EXPIRED' : label;
      return err;
    }

    // TODO(后端契约): 路径为占位，真实对接时与后端对齐（spec §10）。
    async function login(account, password) {
      var r = await fetchImpl(base + '/auth/login', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ account: account, password: password }),
      });
      if (!r.ok) throw apiError('LOGIN_FAILED', r);
      return await r.json();
    }

    async function createSession(user) {
      // D2：后端 CreateSessionBody{user_id}（user-page-spec §10）；user 缺失兜底 anonymous
      var uid = (user && (user.id || user.name)) || 'anonymous';
      var r = await fetchImpl(base + '/sessions', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ user_id: uid }),
      });
      if (!r.ok) throw apiError('SESSION_FAILED', r);
      return await r.json();
    }

    async function getMessages(conversationId) {
      var r = await fetchImpl(base + '/conversations/' + encodeURIComponent(conversationId) + '/messages', { headers: headers() });
      if (!r.ok) throw apiError('MESSAGES_FAILED', r);
      var data = await r.json();
      // D4：后端 {items, mode} -> 页面消费形状 {messages, mode}（loadHistory / applyPollResult）
      return { messages: (data && data.items) || [], mode: data && data.mode };
    }

    async function sendMessage(conversationId, text, onEvent) {
      var r = await fetchImpl(base + '/chat', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ session_id: conversationId, message: text }),
      });
      if (!r.ok || !r.body) throw apiError('SEND_FAILED', r);
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          var block = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          block.split('\n').forEach(function (line) {
            if (line.indexOf('data: ') === 0) onEvent(JSON.parse(line.slice(6)));
          });
        }
      }
      return { ok: true };
    }

    // TODO(后端契约): 动作接口为占位路径。
    async function confirm(conversationId, action) {
      var r = await fetchImpl(base + '/actions/confirm', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ conversation_id: conversationId, action: action }),
      });
      if (!r.ok) throw apiError('CONFIRM_FAILED', r);
      return await r.json();
    }

    async function approve(approvalId, verdict) {
      var r = await fetchImpl(base + '/approvals/' + encodeURIComponent(approvalId), {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ verdict: verdict }),
      });
      if (!r.ok) throw apiError('APPROVE_FAILED', r);
      return await r.json();
    }

    // TODO(后端契约): 动作接口为占位路径。
    async function clarify(conversationId, fields) {
      var r = await fetchImpl(base + '/actions/clarify', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ conversation_id: conversationId, fields: fields || [] }),
      });
      if (!r.ok) throw apiError('CLARIFY_FAILED', r);
      return await r.json();
    }

    return {
      login: login, createSession: createSession, getMessages: getMessages,
      sendMessage: sendMessage, confirm: confirm, approve: approve, clarify: clarify,
    };
  }

  var MOCK_EVENT_DELAY_MS = 120; // P2: mock 事件逐条推送间隔，模拟真实 SSE 流式节奏

  function mockDelay(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function createMockApi(opts) {
    // P1: mock 是会话内状态（刷新即重置，真实历史由后端 Message Store 重建）。
    // 坐席回复只在流内发出 handoff_created 之后才由 getMessages 返回，
    // 避免登录/刷新时预置「人工客服回复 / 人工服务已结束」。
    var delayMs = (opts && opts.delayMs != null) ? opts.delayMs : MOCK_EVENT_DELAY_MS;
    var handoffSeen = false;
    var seatDelivered = false;
    var seat = { id: 'seat-1', role: 'assistant', text: '人工客服：您好，您的退款申请已加急处理，预计 24 小时内到账。' };
    return {
      async login(account) {
        return { token: 'mock-token', user: { name: account || '演示用户' } };
      },
      async createSession() {
        return { conversation_id: 'mock-1', mode: 'ai' };
      },
      async getMessages() {
        if (!handoffSeen) return { messages: [], mode: 'ai' };
        if (!seatDelivered) {
          seatDelivered = true;
          return { messages: [seat], mode: 'human' };
        }
        return { messages: [], mode: 'ai' }; // 模拟人工已解决
      },
      async sendMessage(conversationId, text, onEvent) {
        // mock 演示流去掉 handoff_resolved：让转人工后的轮询真实跑起来（getMessages 返回 mode=ai 模拟人工解决）
        var events = mockStream().filter(function (e) { return e.type !== 'handoff_resolved'; });
        for (var i = 0; i < events.length; i++) {
          if (events[i].type === 'handoff_created') { handoffSeen = true; seatDelivered = false; }
          onEvent(events[i]);
          if (i < events.length - 1) await mockDelay(delayMs);
        }
        return { ok: true };
      },
      async confirm() { return { ok: true }; },
      async approve() { return { ok: true }; },
      async clarify() { return { ok: true }; },
    };
  }

  function mockStream() {
    return [
      { type: 'token', data: { text: '您好，我是澄元智能客服，有问题随时问我。\n可以查订单、聊食谱、查固件更新，也可以申请售后。' } },
      { type: 'tool_call', data: { name: 'order_lookup', args: { order_id: 'A1001' } } },
      { type: 'tool_result', data: { name: 'order_lookup', ok: true, summary: '订单 A1001：已发货，预计明天送达。' } },
      { type: 'clarification_required', data: { missing: ['order_id'] } },
      { type: 'confirmation_required', data: { summary: '修改订单 A1001 收货地址为：北京市朝阳区 xx 路 1 号' } },
      { type: 'confirmation_updated', data: { action: 'confirmed' } },
      { type: 'approval_required', data: { approval_id: 'ap-1', summary: '取消订单 A1001（金额 ¥1,299.00）', expires_at: '2026-09-17T23:59:59Z' } },
      { type: 'approval_updated', data: { approval_id: 'ap-1', status: 'approved' } },
      { type: 'safety_rejected', data: { rule: 'refund_blacklist', reason: '该订单已超出 7 天无理由退款期限' } },
      { type: 'handoff_created', data: { reason: '用户情绪升级', summary: '用户多次要求人工介入' } },
      { type: 'handoff_resolved', data: {} },
      { type: 'error', data: { code: 'E_TIMEOUT', message: '服务响应超时，请重试' } },
      { type: 'done', data: { final: true } },
    ];
  }
  /* __POLL_LAYER__ */

  function nextPollDelay(attempt) {
    var ms = 1000 * Math.pow(2, attempt);
    return ms > 15000 ? 15000 : ms;
  }

  function canRetry(store) {
    return !!(store.auth && !store.auth.expired);
  }

  function isAuthExpiredError(err) {
    return !!(err && (err.status === 401 || err.code === 'AUTH_EXPIRED'));
  }

  function markAuthExpired(store) {
    var s = resetConversation(store);
    s.auth = { token: null, user: null, expired: true };
    return s;
  }

  function markReconnecting(store, message) {
    var s = JSON.parse(JSON.stringify(store));
    s.conn.status = 'reconnecting';
    s.conn.lastError = { code: 'E_RECONNECT', message: message || '连接中断，重连中…' };
    return s;
  }

  function applyPollResult(store, data) {
    var s = JSON.parse(JSON.stringify(store));
    var incoming = (data.messages || []).filter(function (m) {
      return m && typeof m === 'object';
    }).map(function (m) {
      var copy = JSON.parse(JSON.stringify(m));
      copy.meta = { seat: true };
      return copy;
    });
    s.messages = mergeHistory(s.messages, incoming);
    if (data.mode === 'ai' && s.conversation.mode === 'human') {
      s.conversation.mode = 'ai';
      s.conn.status = 'idle';
      s.messages.push({ id: msgId(), role: 'system', kind: 'handoff', content: {}, meta: { state: 'resolved' } });
    } else {
      s.conn.status = 'polling';
    }
    return s;
  }

  async function bootstrapSession(store, api, savedConversationId) {
    var s = resetConversation(store);
    if (savedConversationId) {
      s.conversation.conversation_id = savedConversationId;
      return { store: s, created: false };
    }
    var session = await api.createSession(store.auth && store.auth.user);
    s.conversation.conversation_id = session.conversation_id || session.session_id;
    s.conversation.mode = session.mode || 'ai';
    return { store: s, created: true };
  }
  /* __WIRING__ */

  if (typeof window !== 'undefined') {
    window.UserPage = {
      createInitialStore: createInitialStore,
      resetConversation: resetConversation,
      mergeHistory: mergeHistory,
      resolveView: resolveView,
      applyEvent: applyEvent,
      EVENT_TYPES: EVENT_TYPES,
      buildView: buildView,
      createApi: createApi,
      createMockApi: createMockApi,
      mockStream: mockStream,
      nextPollDelay: nextPollDelay,
      markReconnecting: markReconnecting,
      applyPollResult: applyPollResult,
      canRetry: canRetry,
      isAuthExpiredError: isAuthExpiredError,
      markAuthExpired: markAuthExpired,
      bootstrapSession: bootstrapSession,
    };
  }

  /* ============ DOM 装配层（仅浏览器） ============ */
  if (typeof document === 'undefined') return;

  function mountNode(node) {
    if (typeof node === 'string') return document.createTextNode(node);
    var el = document.createElement(node.tag);
    for (var key in node.attrs) {
      if (key === 'class') el.className = node.attrs[key];
      else el.setAttribute(key, node.attrs[key]);
    }
    node.children.forEach(function (child) { el.appendChild(mountNode(child)); });
    return el;
  }

  var prevMsgCount = 0; // 入场动画判定：仅当消息数量增加时视为新消息
  function applyView() {
    var v = UserPage.buildView(store);
    var tag = document.getElementById('status-tag');
    tag.textContent = v.headerStatus.text;
    tag.className = 'status-tag ' + v.headerStatus.cls;
    document.getElementById('conn-text').textContent = v.headerStatus.connText;
    var chips = document.getElementById('chips');
    chips.innerHTML = '';
    v.chips.forEach(function (node) { chips.appendChild(mountNode(node)); });
    var list = document.getElementById('msg-list');
    var isNewMessage = v.messages.length > prevMsgCount;
    prevMsgCount = v.messages.length;
    list.innerHTML = '';
    v.messages.forEach(function (node) { list.appendChild(mountNode(node)); });
    if (isNewMessage && list.lastElementChild) list.lastElementChild.classList.add('enter');
    // 流式输入光标：仅最后一个 AI 文本气泡
    var lastMsg = store.messages[store.messages.length - 1];
    if (store.conn.status === 'streaming' && lastMsg &&
        lastMsg.role === 'assistant' && lastMsg.kind === 'text' && list.lastElementChild) {
      list.lastElementChild.classList.add('typing');
    }
    document.getElementById('msg-input').disabled = v.inputDisabled;
    document.getElementById('btn-send').disabled = v.inputDisabled;
    list.scrollTop = list.scrollHeight;
  }

  var AUTH_KEY = 'user_page_auth';
  var CONV_KEY = 'user_page_conversation';

  function loadConversationId() {
    try { return window.sessionStorage.getItem(CONV_KEY) || null; } catch (e) { return null; }
  }

  function saveConversationId(id) {
    try {
      if (id) window.sessionStorage.setItem(CONV_KEY, id);
      else window.sessionStorage.removeItem(CONV_KEY);
    } catch (e) { /* ignore */ }
  }

  function clearConversationId() {
    try { window.sessionStorage.removeItem(CONV_KEY); } catch (e) { /* ignore */ }
  }

  function loadAuth() {
    try {
      var raw = window.sessionStorage.getItem(AUTH_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function saveAuth(auth) {
    window.sessionStorage.setItem(AUTH_KEY, JSON.stringify(auth));
  }

  function clearAuth() {
    window.sessionStorage.removeItem(AUTH_KEY);
  }

  function showView(name) {
    var login = document.getElementById('view-login');
    var chat = document.getElementById('view-chat');
    login.classList.toggle('active', name === 'login');
    chat.classList.toggle('active', name === 'chat');
    document.getElementById('topbar-user').hidden = name === 'login';
    if (name === 'chat') {
      var displayName = (store.auth && store.auth.user && store.auth.user.name) || '';
      document.getElementById('user-name').textContent = displayName;
      var avatar = document.getElementById('user-avatar');
      if (avatar) avatar.textContent = displayName ? displayName.slice(0, 1) : '客';
    }
  }

  var store = createInitialStore();
  store.auth = loadAuth();
  store.view = resolveView(window.location.hash, !!(store.auth && store.auth.token));
  showView(store.view);

  window.addEventListener('hashchange', function () {
    store.view = resolveView(window.location.hash, !!(store.auth && store.auth.token));
    showView(store.view);
    if (store.view === 'chat' && !store.conversation.conversation_id) bootstrapChat();
  });

  document.getElementById('btn-logout').addEventListener('click', function () {
    stopPolling();
    if (reconnectTimer !== null) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    clearAuth();
    clearConversationId();
    store = resetConversation(store);
    store.auth = null;
    window.location.hash = '#/login';
    store.view = resolveView(window.location.hash, false);
    showView(store.view);
  });

  function getConfig() {
    var mock = false;
    try {
      mock = new URLSearchParams(window.location.search).get('mock') === 'true' ||
        window.localStorage.getItem('mock') === 'true';
      if (window.location.protocol === 'file:') mock = true;
    } catch (e) { /* ignore */ }
    return { mock: mock, baseUrl: '' };
  }

  store.config = getConfig();
  var api = store.config.mock
    ? createMockApi()
    : createApi({ fetchImpl: window.fetch ? window.fetch.bind(window) : null, baseUrl: store.config.baseUrl });

  function handleAuthExpired() {
    stopPolling();
    if (reconnectTimer !== null) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    clearAuth();
    store = markAuthExpired(store);
    window.location.hash = '#/login';
    store.view = resolveView(window.location.hash, false);
    showView(store.view);
    var errEl = document.getElementById('login-error');
    if (errEl) { errEl.textContent = '登录已过期，请重新登录'; errEl.hidden = false; }
  }

  async function bootstrapChat() {
    if (!store.auth || !store.auth.token) return false;
    stopPolling();
    try {
      var result = await bootstrapSession(store, api, loadConversationId());
      store = result.store;
      if (result.created) saveConversationId(store.conversation.conversation_id);
    } catch (e) {
      if (isAuthExpiredError(e)) { handleAuthExpired(); return false; }
      return false; // 会话启动失败不阻塞对话视图
    }
    var loaded = await loadHistory();
    if (!loaded) return false; // 401 已由 handleAuthExpired 处理
    applyView();
    if (store.conversation.mode === 'human') startPolling();
    return true;
  }

  function pushUserMessage(text) {
    store.messages.push({ id: msgId(), role: 'user', kind: 'text', content: text, meta: {} });
    store.conn.status = 'streaming';
    applyView();
  }

  function pushHistory(messages) {
    store.messages = mergeHistory(store.messages, messages);
    applyView();
  }

  async function loadHistory() {
    try {
      var data = await api.getMessages(store.conversation.conversation_id);
      if (data) {
        if (data.messages) pushHistory(data.messages);
        if (data.mode) {
          store.conversation.mode = data.mode;
          store.conn.status = data.mode === 'human' ? 'polling' : 'idle';
        }
        applyView();
      }
      return true;
    } catch (e) {
      if (isAuthExpiredError(e)) { handleAuthExpired(); return false; }
      /* 历史加载失败不阻塞对话 */
      return true;
    }
  }

  function doSend() {
    var input = document.getElementById('msg-input');
    var text = input.value.trim();
    if (!text) return;
    // P2: 流式/重连期间禁止重复发送（chips 点击也走 doSend）
    if (store.conn.status === 'streaming' || store.conn.status === 'reconnecting') return;
    input.value = '';
    pushUserMessage(text);
    api.sendMessage(store.conversation.conversation_id, text, function (event) {
      store = applyEvent(store, event);
      applyView();
    }).catch(function (e) {
      if (isAuthExpiredError(e)) { handleAuthExpired(); return; }
      store = markReconnecting(store, '连接中断，正在重连…');
      applyView();
      scheduleReconnect(text, 0);
    }).then(function () {
      if (store.conversation.mode === 'human' && typeof startPolling === 'function') startPolling();
    });
  }

  async function doLogin() {
    var account = document.getElementById('login-account').value;
    var password = document.getElementById('login-password').value;
    var errEl = document.getElementById('login-error');
    errEl.hidden = true;
    try {
      var auth;
      try {
        auth = await api.login(account, password);
      } catch (e) {
        if (!isNetworkFailure(e) || store.config.mock) throw e;
        enableMockMode();
        auth = await api.login(account, password);
        var hint = document.querySelector('.login-wrap .hint:not(.error)');
        if (hint) hint.textContent = '后端未连接，已进入 mock 演示模式';
      }
      saveAuth(auth);
      store.auth = auth;
      var ok = await bootstrapChat();
      if (!ok) {
        if (store.auth && store.auth.token) {
          errEl.textContent = '会话创建失败，请重试';
          errEl.hidden = false;
        }
        return;
      }
      window.location.hash = '#/chat';
      store.view = resolveView('#/chat', true);
      showView(store.view);
    } catch (e) {
      errEl.textContent = '登录失败：' + e.message;
      errEl.hidden = false;
    }
  }

  function isNetworkFailure(e) {
    return !!(e && (e.name === 'TypeError' ||
      /failed to fetch|networkerror|load failed/i.test(e.message || '')));
  }

  function enableMockMode() {
    store.config.mock = true;
    api = createMockApi();
  }

  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('btn-send').addEventListener('click', doSend);
  document.getElementById('msg-input').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); doSend(); }
  });

  document.getElementById('chips').addEventListener('click', function (ev) {
    var chip = ev.target.closest('button.chip');
    if (!chip) return;
    document.getElementById('msg-input').value = chip.getAttribute('data-cmd');
    doSend();
  });

  document.getElementById('msg-list').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    if (action === 'clarify') {
      // 澄清快捷补全：点击把字段名带入输入框并聚焦，用户补值后回车发送
      var field = btn.getAttribute('data-field') || '';
      var input = document.getElementById('msg-input');
      input.value = field + ': ';
      input.focus();
      return;
    }
    var verdict = action === 'confirm' ? 'confirmed' : 'canceled';
    if (!store.pendingAction || store.pendingAction.kind !== 'confirm') return;
    api.confirm(store.conversation.conversation_id, verdict)
      .then(function (result) {
        var next = store;
        (result.events || []).forEach(function (event) {
          if (event.type === 'tool_call' || event.type === 'tool_result') {
            next = applyEvent(next, event);
          }
        });
        if (result.final) {
          next.messages.push({ id: msgId(), role: 'assistant', kind: 'text', content: result.final, meta: {} });
        }
        next.conn.status = 'idle';
        next = applyEvent(next, { type: 'confirmation_updated', data: { action: verdict } });
        store = next;
        applyView();
      })
      .catch(function (e) {
        store = applyEvent(store, { type: 'error', data: { code: 'E_CONFIRM', message: e.message } });
        applyView();
      });
  });

  var pollTimer = null;
  var pollAttempt = 0;
  var reconnectTimer = null;

  function startPolling() {
    if (pollTimer !== null || store.conversation.mode !== 'human') return;
    pollAttempt = 0;
    schedulePoll();
  }

  function stopPolling() {
    if (pollTimer !== null) { clearTimeout(pollTimer); pollTimer = null; }
  }

  function schedulePoll() {
    if (store.conversation.mode !== 'human') { pollTimer = null; return; }
    pollTimer = setTimeout(pollOnce, nextPollDelay(pollAttempt));
  }

  async function pollOnce() {
    if (store.conversation.mode !== 'human') { pollTimer = null; return; }
    try {
      var data = await api.getMessages(store.conversation.conversation_id);
      pollAttempt = 0;
      store = applyPollResult(store, data);
      applyView();
      if (store.conversation.mode === 'ai') { pollTimer = null; return; }
    } catch (e) {
      if (isAuthExpiredError(e)) { handleAuthExpired(); return; }
      pollAttempt = Math.min(pollAttempt + 1, 10);
    }
    schedulePoll();
  }

  function scheduleReconnect(text, attempt) {
    if (reconnectTimer !== null) clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(function () {
      reconnectTimer = null;
      if (!canRetry(store)) return; // 已退出登录：停止重连
      api.sendMessage(store.conversation.conversation_id, text, function (event) {
        store = applyEvent(store, event);
        applyView();
      }).then(function () {
        if (store.conversation.mode === 'human') startPolling();
      }).catch(function (e) {
        if (isAuthExpiredError(e)) { handleAuthExpired(); return; }
        store = markReconnecting(store, '连接中断，' + nextPollDelay(attempt + 1) + 'ms 后重试');
        applyView();
        scheduleReconnect(text, attempt + 1);
      });
    }, nextPollDelay(attempt));
  }

  /* ---- 主题（深浅模式：默认跟随系统，手动选择持久化到 localStorage） ---- */
  var THEME_KEY = 'user_page_theme';

  function getInitialTheme() {
    try {
      var saved = window.localStorage.getItem(THEME_KEY);
      if (saved === 'light' || saved === 'dark') return saved;
    } catch (e) { /* ignore */ }
    if (typeof window.matchMedia === 'function' &&
        window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
    return 'light';
  }

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    var btn = document.getElementById('btn-theme');
    if (btn) btn.setAttribute('aria-label', theme === 'dark' ? '切换到浅色模式' : '切换到深色模式');
  }

  var currentTheme = getInitialTheme();
  setTheme(currentTheme);
  var themeBtn = document.getElementById('btn-theme');
  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      try { window.localStorage.setItem(THEME_KEY, currentTheme); } catch (e) { /* ignore */ }
      setTheme(currentTheme);
    });
  }
  if (typeof window.matchMedia === 'function') {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSchemeChange = function (ev) {
      var saved = null;
      try { saved = window.localStorage.getItem(THEME_KEY); } catch (e) { /* ignore */ }
      if (!saved) setTheme(ev.matches ? 'dark' : 'light');
    };
    if (mq.addEventListener) mq.addEventListener('change', onSchemeChange);
  }

  applyView();
  if (store.view === 'chat') bootstrapChat();
})();
</script>
</body>
</html>
