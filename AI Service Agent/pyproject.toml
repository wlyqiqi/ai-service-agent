[project]
name = "ai-service-agent"
version = "0.1.0"
description = "LangGraph agent project (reuses D:\常用软件\LangGragh\.venv)"
readme = "README.md"
authors = [
    { name = "Wang Qi", email = "hyoon0415@163.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.5.3,<2",
    "langchain-openai>=1.4.1,<2",
    "langgraph>=1.2.10,<2",
    "langgraph-checkpoint>=4.1.1,<5",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "langsmith>=0.10.14,<1",
]

[project.scripts]
ai-service-agent = "ai_service_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
